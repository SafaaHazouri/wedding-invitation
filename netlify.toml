[build]
  publish = "."
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/halim"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/halim/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/share"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/share/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/card"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/card/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/door"
  to = "/checkin.html"
  status = 200

[[redirects]]
  from = "/door/"
  to = "/checkin.html"
  status = 200
