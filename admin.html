<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>قائمة الحضور</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=El+Messiri:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-body">
  <main class="admin-shell">
    <section class="admin-card" id="lockCard">
      <img class="admin-logo" src="logo-ms.png" alt="" />
      <h1>قائمة حضور محمد وأميرته</h1>
      <p>أدخلوا كلمة المرور لعرض تأكيدات المعازيم</p>
      <form id="lockForm">
        <input type="password" id="adminKey" placeholder="كلمة المرور" required />
        <button type="submit" class="submit-btn">دخول</button>
        <p class="form-note" id="lockNote" hidden></p>
      </form>
    </section>

    <section class="admin-panel" id="listCard" hidden>
      <header class="admin-head">
        <div>
          <h1>سجل الحضور</h1>
          <p>يتحدث فور تسجيل المعازيم</p>
        </div>
        <button type="button" class="guest-btn" id="refreshBtn">تحديث</button>
      </header>
      <form class="scan-box" id="scanForm">
        <input id="scanInput" type="text" inputmode="text" autocomplete="off" placeholder="امسحوا الباركود أو اكتبوا رمز التذكرة" />
        <button type="submit" class="submit-btn">تسجيل الدخول</button>
      </form>
      <p class="scan-result" id="scanResult" hidden></p>
      <div class="admin-stats" id="stats"></div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>الاسم</th>
              <th>مدعو من قبل</th>
              <th>الحالة</th>
              <th>الباركود</th>
              <th>الدخول</th>
              <th>الأمنية</th>
              <th>الإجراء</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="ticket.js"></script>
  <script src="admin.js"></script>
</body>
</html>
